<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="0.5" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#3f3f46"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="url(#shimmer)" filter="url(#glow)" font-size="20" xml:space="preserve">
    <text x="18" y="42"> ____   _____    ___   _   _     _    __   __</text>
    <text x="18" y="70">/ ___|  | ____|  / _ \  | \ | |    / \    \ \ / /</text>
    <text x="18" y="98">\___ \  |  _|   | | | | |  \| |   / _ \    \ V / </text>
    <text x="18" y="126"> ___) | | |___  | |_| | | |\  |  / ___ \    | |  </text>
    <text x="18" y="154">|____/  |_____|  \___/  |_| \_| /_/   \_\   |_|  </text>
  </g>

  <g font-size="15" fill="#a1a1aa" xml:space="preserve">
    <text x="20" y="192">&gt; Full Stack Developer</text>
    <text x="215" y="192" fill="#fafafa">
      _
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
